name: ⚡️ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs only: with checkSuites on, Railway waits for every
# main commit's CI to finish before deploying it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: 🔍 Check
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env files
        run: |
          for f in $(git ls-files '*.env.example'); do
            cp "$f" "${f%.example}"
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install deps
        id: setup
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm biome ci .

      - name: Typecheck, Build, Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm turbo run typecheck build test --continue
