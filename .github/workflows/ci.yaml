name: ⚡️ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs only: with checkSuites on, Railway waits for every
# main commit's CI to finish before deploying it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ✅ Checks
    runs-on: ubuntu-latest
    # vite.config.ts in web and dartboard requires it to build
    env:
      SERVER_URL: http://localhost:4000
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install deps
        id: setup
        run: pnpm install --frozen-lockfile

      # Checks below run even if an earlier one fails, so one run reports every
      # failure. They still skip if any setup step above failed
      - name: Check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm biome ci .

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm build

      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test
