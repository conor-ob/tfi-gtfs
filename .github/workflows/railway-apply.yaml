name: 🚂 Railway apply

# Applies the plan pinned on the merged PR, so there's no manual trigger: the
# action finds the plan through the PR, and fails if the environment or
# .railway/ moved since
on:
  push:
    branches:
      - main
    paths:
      - ".railway/**"

permissions:
  contents: read
  # Download the plan artifact and find the commit's merged PR
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  apply:
    name: 🚀 Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Railway config apply
        uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
