version: 2

updates:
  # One entry covers the whole pnpm workspace, catalog included
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give the registry a week to catch compromised or yanked releases
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /apps/dartboard
      - /apps/server
      - /apps/web
      - /jobs/schedule-sync
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # Node majors are moved deliberately, to the next LTS, alongside engines
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Postgres majors need a data upgrade, and must match Railway and CI
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Redis majors must match Railway and CI
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
