# Local Postgres for development and tests: `pnpm db:up` / `pnpm db:down`.
# Uses the default port 5432, so stop any other local Postgres first.
services:
  postgres:
    image: postgres:18-alpine
    container_name: tfi-gtfs-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tfi-gtfs
    ports:
      - "5432:5432"
    # Docker's default 64 MB /dev/shm is too small for parallel index builds
    # after bulk-loading the Schedule
    shm_size: 512mb
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tfi-gtfs"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
