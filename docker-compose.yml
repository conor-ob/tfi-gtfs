# Local Redis for development and tests: `pnpm db:up` / `pnpm db:down`. Uses
# the default port 6379, so stop any other local Redis first.
services:
  # Trip Updates are disposable, so no volume
  redis:
    image: redis:8-alpine
    container_name: tfi-gtfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
